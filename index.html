<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F9FA" />
    <meta name="format-detection" content="telephone=no" />
    <title>Maczkó Tetőfedés - Minőségi Tetőfedés &amp; Bádogozás</title>
    <meta name="description" content="Maczkó Tetőfedés - Professzionális tetőfedés, bádogozás és tetőfelújítás. Minőségi munka, garanciával." />
    <meta name="keywords" content="tetőfedés, bádogozás, tetőfelújítás, Maczkó Tetőfedés, ácsmunka" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />

    <!-- High-priority preloads for critical above-the-fold assets -->
    <link rel="preload" as="image" href="/images/hero1.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/logo.png" type="image/png" />

    <!-- Preconnect to external origins for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking Google Fonts with immediate display swap -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Inline critical styles for instant hero pre-rendering (<300ms) -->
    <style>
      :root {
        --color-primary: #126b31;
        --color-dark: #1A3A36;
      }
      body {
        margin: 0;
        background: #FFFFFF;
        color: var(--color-dark);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .prerender-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1280px;
        margin: 0 auto;
        z-index: 50;
        box-sizing: border-box;
      }
      .prerender-brand {
        display: flex;
        align-items: center;
        gap: 16px;
        text-decoration: none;
        color: var(--color-dark);
      }
      .prerender-logo {
        height: 48px;
        width: auto;
      }
      .prerender-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .prerender-hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 120px 24px 48px;
        max-width: 1280px;
        margin: 0 auto;
        box-sizing: border-box;
      }
      .prerender-hero-content {
        max-width: 640px;
      }
      .prerender-h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(36px, 6vw, 64px);
        font-weight: 700;
        line-height: 1.1;
        margin: 0 0 20px;
        color: var(--color-dark);
      }
      .prerender-desc {
        font-size: 18px;
        line-height: 1.6;
        color: rgba(26, 58, 54, 0.7);
        margin: 0 0 32px;
      }
      .prerender-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 32px;
        border-radius: 9999px;
        background: var(--color-primary);
        color: #FFFFFF;
        font-weight: 700;
        font-size: 16px;
        text-decoration: none;
        box-shadow: 0 10px 25px -5px rgba(18, 107, 49, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <header class="prerender-nav">
        <div class="prerender-brand">
          <img src="/images/logo.png" alt="Maczkó Tetőfedés Logo" class="prerender-logo" width="62" height="48" />
          <span class="prerender-title">Maczkó <span style="color: #126b31;">Tetőfedés</span></span>
        </div>
      </header>
      <main class="prerender-hero">
        <div class="prerender-hero-content">
          <h1 class="prerender-h1">A Tető <span style="color: #126b31;">Mindenek</span> Felett.</h1>
          <div class="prerender-desc">
            Maczkó Zsolt vagyok. Tisztelem és szeretem a szakmámat, ahol a tradicionális tudás a modern technológiával találkozik. Tartós, esztétikus és értékálló megoldásokat kínálok az Ön otthonához.
          </div>
          <a href="#contact" class="prerender-cta">Ingyenes Felmérés</a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
